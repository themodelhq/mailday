# Render Blueprint — provisions backend web service, Postgres, and Redis.
services:
  - type: web
    name: mailday-backend
    runtime: node
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: mailday-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: mailday-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      # Optional integrations (leave blank to use built-in defaults)
      - key: ELASTICSEARCH_URL
        sync: false
      - key: EMBEDDINGS_ENABLED
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ZAI_API_KEY
        sync: false
      - key: ZAI_MODEL
        sync: false
      - key: VAULT_SECRET
        sync: false
      - key: IMAP_HOST
        sync: false
      - key: IMAP_PORT
        sync: false
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASS
        sync: false
      - key: IMAP_SECURE
        sync: false
      - key: IMAP_POLL_SECONDS
        sync: false

databases:
  - name: mailday-db
    databaseName: mailday
    plan: free
    postgresMajorVersion: "15"

  - name: mailday-redis
    plan: free
    ipAllowList: []
