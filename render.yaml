# Render Blueprint — provisions backend web service, Postgres, and Redis.
services:
  - type: web
    name: mailday-backend
    runtime: node
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /health/ready
    disk:
      name: mailday-attachments
      mountPath: /var/data/mailday-attachments
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: mailday-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: mailday-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      # Optional integrations (leave blank to use built-in defaults)
      - key: ELASTICSEARCH_URL
        sync: false
      - key: EMBEDDINGS_ENABLED
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OUTBOUND_WORKER_ENABLED
        value: "true"
      - key: OUTBOUND_WORKER_POLL_MS
        value: "5000"
      - key: MAILDAY_EMAIL_DOMAIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: onboarding@resend.dev
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: SMTP_CONNECTION_TIMEOUT_MS
        value: "15000"
      - key: SMTP_GREETING_TIMEOUT_MS
        value: "15000"
      - key: SMTP_SOCKET_TIMEOUT_MS
        value: "60000"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: MAIL_FROM
        sync: false # legacy fallback for SMTP
      - key: ZAI_API_KEY
        sync: false
      - key: ZAI_MODEL
        sync: false
      - key: VAULT_SECRET
        sync: false
      - key: IMAP_HOST
        sync: false
      - key: IMAP_PORT
        sync: false
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASS
        sync: false
      - key: IMAP_SECURE
        sync: false
      - key: IMAP_POLL_SECONDS
        sync: false
      - key: INBOUND_WEBHOOK_TOKEN
        generateValue: true
      - key: DELIVERY_BOUNCE_WEBHOOK_TOKEN
        generateValue: true
      - key: ATTACHMENTS_DIR
        value: /var/data/mailday-attachments
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: 3310
      - key: CLAMAV_TIMEOUT_MS
        value: 10000

databases:
  - name: mailday-db
    databaseName: mailday
    plan: free
    postgresMajorVersion: "15"

  - name: mailday-redis
    plan: free
    ipAllowList: []
