name: Security remediation (semver-compatible)

# Re-run this workflow after remediation changes to refresh audit artifacts.
# It intentionally tolerates unresolved findings so reports can be reviewed.
on:
  push:
    branches:
      - security/audit-fix-semver
    paths:
      - .github/workflows/security-audit-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/audit-fix-semver
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Apply backend semver-compatible fixes (do not block on remaining audit findings)
        working-directory: backend
        run: npm audit fix || echo "Audit still reports findings; lockfile updates will be reviewed separately."
      - name: Apply frontend semver-compatible fixes (do not block on remaining audit findings)
        working-directory: frontend
        run: npm audit fix || echo "Audit still reports findings; lockfile updates will be reviewed separately."
      - name: Apply targeted frontend security upgrades
        working-directory: frontend
        run: npm install next@^16.4.6 eslint-config-next@^16.4.6 react@^19.2.5 react-dom@^19.2.5 @types/react@^19.2.7 @types/react-dom@^19.2.3 eslint@^9.39.1 zod@^4.6.7
      - name: Apply targeted backend major security upgrades
        working-directory: backend
        run: npm install @nestjs/common@^11.1.17 @nestjs/core@^11.1.17 @nestjs/platform-express@^11.1.17 @nestjs/config@^4.0.4 @nestjs/cli@^11.0.17 @nestjs/testing@^11.1.17 @nestjs/schematics@^11.1.0 @typescript-eslint/eslint-plugin@^8.73.0 @typescript-eslint/parser@^8.73.0 nodemailer@^10.6.1
      - name: Verify frontend and backend lockfile synchronization
        run: |
          npm --prefix frontend install --package-lock-only --ignore-scripts
          npm --prefix backend install --package-lock-only --ignore-scripts
      - name: Commit updated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes produced."
          else
            git commit -m "security: upgrade backend framework dependencies"
            git push origin security/audit-fix-semver
          fi
      - name: Validate backend dependencies, Prisma, build, and tests
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build
          npm test -- --runInBand
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/mailday
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
      - name: Validate frontend install and production build
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
      - name: Capture final backend audit summary
        working-directory: backend
        run: npm audit --json > backend-audit.json || true
      - name: Capture final frontend audit summary
        working-directory: frontend
        run: npm audit --json > frontend-audit.json || true
      - name: Upload final audit reports
        uses: actions/upload-artifact@v4
        with:
          name: security-remediation-audit-reports
          path: |
            backend/backend-audit.json
            frontend/frontend-audit.json
          retention-days: 30
