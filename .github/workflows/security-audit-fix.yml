name: Security remediation (semver-compatible)

on:
  push:
    branches:
      - security/audit-fix-semver
    paths:
      - .github/workflows/security-audit-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/audit-fix-semver
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Apply backend semver-compatible fixes (do not block on remaining audit findings)
        working-directory: backend
        run: npm audit fix || echo "Audit still reports findings; lockfile updates will be reviewed separately."
      - name: Apply frontend semver-compatible fixes (do not block on remaining audit findings)
        working-directory: frontend
        run: npm audit fix || echo "Audit still reports findings; lockfile updates will be reviewed separately."
      - name: Commit updated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No semver-compatible lockfile changes produced."
          else
            git commit -m "security: apply semver-compatible audit fixes"
            git push origin security/audit-fix-semver
          fi
      - name: Validate backend dependencies, Prisma, build, and tests
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm run build
          npm test -- --runInBand
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/mailday
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
      - name: Validate frontend install and production build
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
      - name: Capture final backend audit summary
        working-directory: backend
        run: npm audit --json > backend-audit.json || true
      - name: Capture final frontend audit summary
        working-directory: frontend
        run: npm audit --json > frontend-audit.json || true
      - name: Upload final audit reports
        uses: actions/upload-artifact@v4
        with:
          name: security-remediation-audit-reports
          path: |
            backend/backend-audit.json
            frontend/frontend-audit.json
          retention-days: 30
